services:
    mysql_db:
        container_name: mysqlcontainer
        image: mysql:8.4
        restart: always
        ports:
            - '3307:3306'
        volumes:
            - mysql_data:/var/lib/mysql
        environment:
            - MYSQL_USER=${MYSQL_DB_USERNAME}
            - MYSQL_PASSWORD=${MYSQL_DB_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DB_DATABASE}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        networks:
            - internalnet
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD']
            interval: 10s
            timeout: 5s
            retries: 10

    nestjs_api:
        container_name: nodeappcontainer
        build:
            context: .
            dockerfile: Dockerfile
        restart: always
        env_file:
            - .env
        ports:
            - '${PORT}:${PORT}'
        depends_on:
            mysql_db:
                condition: service_healthy
        environment:
            - PORT=${PORT}
            - NODE_ENV=development
            - MYSQL_DB_HOST=mysql_db
            # 3306 is MySQL's port inside the Docker network.
            # 3307 is only used from the host machine.
            - MYSQL_DB_PORT=3306
            - MYSQL_DB_USERNAME=${MYSQL_DB_USERNAME}
            - MYSQL_DB_PASSWORD=${MYSQL_DB_PASSWORD}
            - MYSQL_DB_DATABASE=${MYSQL_DB_DATABASE}
        volumes:
            - ./src:/usr/src/app/src
            - ./uploads:/usr/src/app/uploads
        networks:
            - internalnet

volumes:
  mysql_data:
    driver: local

networks:
  internalnet:
    driver: bridge
