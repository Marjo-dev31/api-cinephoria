services:
    mysql_db:
        container_name: mysqlcontainer
        image: mysql:8.4
        restart: always
        ports:
            - '3307:3306'
        volumes:
            - mysql_data:/var/lib/mysql
        environment:
            - MYSQL_USER=${MYSQL_DB_USERNAME}
            - MYSQL_PASSWORD=${MYSQL_DB_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DB_DATABASE}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        networks:
            - internalnet
        healthcheck:
            test: ['CMD-SHELL', 'mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD']
            interval: 10s
            timeout: 5s
            retries: 10

    mongodb:
        image: mongo:8
        container_name: mongodb
        restart: always
        environment:
            - MONGO_INITDB_DATABASE=${MONGO_DB}
            - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
            - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
        ports:
            - "27017:27017"
        volumes:
            - mongodb_data:/data/db
        networks:
            - internalnet
        healthcheck:
            test: ['CMD-SHELL', 'mongosh --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --quiet --eval "db.adminCommand(\"ping\")"']
            interval: 10s
            timeout: 5s
            retries: 10

    nestjs_api:
        container_name: nodeappcontainer
        build:
            context: .
            dockerfile: Dockerfile
        restart: always
        env_file:
            - .env
        ports:
            - '${PORT}:${PORT}'
        depends_on:
            mysql_db:
                condition: service_healthy
            mongodb:
                condition: service_healthy
        environment:
            - PORT=${PORT}
            - NODE_ENV=development
            - MYSQL_DB_HOST=mysql_db
            # 3306 is MySQL's port inside the Docker network.
            # 3307 is only used from the host machine.
            - MYSQL_DB_PORT=3306
            - MYSQL_DB_USERNAME=${MYSQL_DB_USERNAME}
            - MYSQL_DB_PASSWORD=${MYSQL_DB_PASSWORD}
            - MYSQL_DB_DATABASE=${MYSQL_DB_DATABASE}
            - MONGO_HOST=mongodb
            - MONGO_PORT=27017
            - MONGO_USERNAME=${MONGO_USERNAME}
            - MONGO_PASSWORD=${MONGO_PASSWORD}
            - MONGO_DB=${MONGO_DB}
            - MONGO_URI=mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
        volumes:
            - ./src:/usr/src/app/src
            - ./uploads:/usr/src/app/uploads
        networks:
            - internalnet

volumes:
  mysql_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  internalnet:
    driver: bridge
